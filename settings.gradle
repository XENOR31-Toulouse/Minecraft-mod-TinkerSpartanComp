pluginManagement {
    repositories {
        maven {
            // RetroFuturaGradle (toolchain ForgeGradle moderne pour 1.12.2)
            name 'GTNH Maven'
            url 'https://nexus.gtnewhorizons.com/repository/public/'
            mavenContent {
                includeGroup 'com.gtnewhorizons'
                includeGroup 'com.gtnewhorizons.retrofuturagradle'
            }
        }
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    // Télécharge un JDK 8 automatiquement s'il n'est pas trouvé localement
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'tconspartan'
